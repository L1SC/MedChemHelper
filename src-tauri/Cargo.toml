[package]
name = "medchemhelper-tauri"
version = "1.0.0"
description = "MedChemHelper - Tauri 实验版"
authors = ["MedChemHelper"]
edition = "2021"
build = "build.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
